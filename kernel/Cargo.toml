[package]
name = "kernel"
description = "The Meridian kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "kernel"
path = "src/main.rs"
test = true

[features]
# Builds the kernel as a QEMU test image that reports over the serial port
# and ends QEMU through its isa-debug-exit device.
qemu-test = ["x86/qemu-test"]

[dependencies]
abi = { path = "../lib/abi" }
acpi = { path = "../lib/acpi" }
ahci = { path = "../lib/ahci" }
bootinfo = { path = "../lib/bootinfo" }
canvas = { path = "../lib/canvas" }
channel = { path = "../lib/channel" }
elf = { path = "../lib/elf" }
fat = { path = "../lib/fat" }
font = { path = "../lib/font" }
gpt = { path = "../lib/gpt" }
frames = { path = "../lib/frames" }
handles = { path = "../lib/handles" }
heap = { path = "../lib/heap" }
nvme = { path = "../lib/nvme" }
paging = { path = "../lib/paging" }
ps2 = { path = "../lib/ps2" }
pci = { path = "../lib/pci" }
virtio = { path = "../lib/virtio" }
sched = { path = "../lib/sched" }
security = { path = "../lib/security" }
qr = { path = "../lib/qr" }
x86 = { path = "../lib/x86" }

[lints]
workspace = true
