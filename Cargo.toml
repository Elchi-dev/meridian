[workspace]
resolver = "3"
members = ["boot", "kernel", "lib/abi", "lib/acpi", "lib/ahci", "lib/bootinfo", "lib/canvas", "lib/channel", "lib/elf", "lib/fat", "lib/font", "lib/frames", "lib/gpt", "lib/handles", "lib/heap", "lib/meri", "lib/nvme", "lib/paging", "lib/pci", "lib/program", "lib/ps2", "lib/qr", "lib/regex", "lib/sched", "lib/security", "lib/services", "lib/shell", "lib/uefi", "lib/virtio", "lib/x86"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Elchi-dev/meridian"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Names like uefi::status::Status read better than the alternatives.
module_name_repetitions = "allow"
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true

# Programs go onto images and are read from disk, where debug info is only
# weight: a debug build of exitwith is 1.7 MB with it and 46 KB without.
[profile.dev.package.program]
strip = "debuginfo"

[profile.release.package.program]
strip = "debuginfo"
