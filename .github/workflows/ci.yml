name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      mutate:
        description: "Files to mutate, from the repository's root, parted by spaces"
        required: false
        default: ""

permissions:
  contents: read

env:
  GOTOOLCHAIN: auto
  SEXTANT_REQUIRE_TOOLS: "1"
  CARGO_TERM_COLOR: never

jobs:
  linux:
    name: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install QEMU, OVMF and the image checking tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq qemu-system-x86 ovmf dosfstools mtools xorriso fdisk libarchive-tools qrencode zbar-tools

      - name: Let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # Every check is in 'sextant ci', so a run on any machine is what
      # CI does.
      - name: Every check, as sextant ci runs them
        working-directory: tools/sextant
        run: go run ./cmd/sextant ci

  mutate:
    name: mutation of what changed
    # Pushes, which say which commit came before, so the files they
    # changed are known; and runs by hand that name the files.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mutate != '')
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The same tools as the linux job, since tests that read the images
      # back insist on them here too.
      - name: Install QEMU, OVMF and the image checking tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq qemu-system-x86 ovmf dosfstools mtools xorriso fdisk libarchive-tools qrencode zbar-tools

      - name: Let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Mutate the files this push changed, or those asked for
        working-directory: tools/sextant
        env:
          BEFORE: ${{ github.event.before }}
          FILES: ${{ inputs.mutate }}
        run: |
          if [ -n "$FILES" ]; then
            set -f
            go run ./cmd/sextant mutate --jobs 4 $(printf '../../%s ' $FILES)
            exit
          fi
          # A new branch, or a push that rewrote history, has no commit
          # before it here; the parent of the newest one stands in.
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then BEFORE=HEAD~1; fi
          go run ./cmd/sextant mutate --since "$BEFORE" --jobs 4

  sextant:
    name: sextant on ${{ matrix.os }}
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mutate == '') || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      SEXTANT_REQUIRE_TOOLS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The macOS runners keep Go in their tool cache without putting it on
      # the path.
      - name: Put Go on the path
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if command -v go >/dev/null; then exit 0; fi
          bin=$(ls -d "$RUNNER_TOOL_CACHE"/go/*/*/bin 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$bin" ]; then echo "$bin" >> "$GITHUB_PATH"; else brew install go; fi

      # Installed once up front: tests that build the images run Cargo in
      # parallel, and several installs of the same toolchain at once break.
      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - name: Build and test sextant
        working-directory: tools/sextant
        shell: bash
        run: |
          go vet ./...
          go test -count=1 ./...
          go build -o "$RUNNER_TEMP/sextant" ./cmd/sextant
          "$RUNNER_TEMP/sextant" version
