[workspace]
resolver = "3"
members = ["boot", "kernel", "lib/bootinfo", "lib/elf", "lib/font", "lib/paging", "lib/uefi", "lib/x86"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Elchi-dev/meridian"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Names like uefi::status::Status read better than the alternatives.
module_name_repetitions = "allow"
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
