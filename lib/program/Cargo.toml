[package]
name = "program"
description = "What a Meridian program written in Rust is built on: system calls, its start and its log"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
abi = { path = "../abi" }
diff = { path = "../diff" }
fat = { path = "../fat" }
heap = { path = "../heap" }
meri = { path = "../meri" }
regex = { path = "../regex" }
security = { path = "../security" }
sed = { path = "../sed" }
services = { path = "../services" }
shell = { path = "../shell" }

